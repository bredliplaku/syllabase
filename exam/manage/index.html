<!DOCTYPE html>
<html lang="en-GB" class="syllatest">

<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#f4f4f4">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syllatest for lecturers</title>
  <meta name="description" content="Your courses' exams, grading and students.">
  <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="/favicon/exam.webmanifest" />
  <!-- The background of the saved or system theme until the page is mounted. -->
  <style id="teaching-startup-theme">
    html {
      color-scheme: light;
      background: #f4f4f4;
      color: #333;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      background: #000;
      color: #e0e0e0;
    }

    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) {
        color-scheme: dark;
        background: #000;
        color: #e0e0e0;
      }
    }

    body {
      margin: 0;
      background: inherit;
    }
  </style>
  <script>
    (function () {
      let theme = 'auto';
      try { theme = localStorage.getItem('theme-preference') || 'auto'; } catch { }
      if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
      const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.querySelector('meta[name="theme-color"]').content = dark ? '#000000' : '#f4f4f4';
    })();
  </script>
  <!-- Syllatest for lecturers: the course editor with only its Exams, Grading and Students tabs.
       This page has no markup of its own: it mounts the editor's own page (the site's
       index.html) here, as embed.js does on lecturer websites, so the two never differ. -->
  <script src="../../js/manage-loader.js"></script>
</head>

<body>
  <noscript>Please enable JavaScript to manage exams.</noscript>
</body>

</html>
