<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#f4f4f4">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timetable Panel</title>
  <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="/favicon/site.webmanifest" />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;700&display=swap" rel="stylesheet">
  <script defer src="https://kit.fontawesome.com/4dd5c549ad.js" crossorigin="anonymous"></script>
  <!-- GitHub Pages 301-redirects /timetable/admin to /timetable/admin/; some dev
       servers (VS Code Live Server) just serve the index as-is, and every relative
       path then resolves one directory too high. The trailing slash also has to
       match the Supabase redirect-URL allowlist, so normalise before sign-in runs —
       keeping the OAuth #access_token fragment intact. -->
  <script>
    (function () {
      const p = location.pathname;
      if (!p.endsWith('/') && !p.split('/').pop().includes('.')) {
        location.replace(p + '/' + location.search + location.hash);
      }
    })();
  </script>
  <!-- Match the saved or system theme before external styles and sign-in load
       (the same startup theme as the teaching admin), so there is no white flash. -->
  <style id="teaching-startup-theme">
    html {
      color-scheme: light;
      background: #f4f4f4;
      color: #333;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      background: #000;
      color: #e0e0e0;
    }

    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) {
        color-scheme: dark;
        background: #000;
        color: #e0e0e0;
      }
    }

    body {
      margin: 0;
      background: inherit;
    }
  </style>
  <script>
    (function () {
      let theme = 'auto';
      try { theme = localStorage.getItem('theme-preference') || 'auto'; } catch { }
      if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
      const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.querySelector('meta[name="theme-color"]').content = dark ? '#000000' : '#f4f4f4';
    })();
  </script>
  <link rel="stylesheet" href="../../css/main.css">
  <!-- The teaching admin's styles, shared so both panels look the same. -->
  <link rel="stylesheet" href="../../css/editor.css">
  <!-- Categories with their entries nested inside. -->
  <link rel="stylesheet" href="css/styles.css">
  <!-- Not deferred: picks the signed-in or signed-out skeleton before the first paint. -->
  <script src="../../js/skeleton.js" data-page="timetable-admin"></script>
</head>

<body>

  <!-- Loading placeholders. ../../js/skeleton.js shows one before the first paint: the
       panel when a session is stored, the sign-in card otherwise. js/scripts.js fades it
       once the real screen is ready. -->
  <div id="app-loading" class="skeleton-screen skeleton-signed-in" aria-hidden="true">
    <div class="skel-topbar">
      <div class="skeleton skel-topbar-title"></div>
      <div class="skeleton skel-topbar-user"></div>
      <div class="skeleton skel-topbar-button"></div>
    </div>
    <div class="skel-main">
      <div class="skel-main-inner">
        <div class="skel-pills skel-section-tabs">
          <div class="skeleton" style="--w:118px"></div>
          <div class="skeleton" style="--w:96px"></div>
        </div>
        <div class="skel-outline skel-card">
          <div class="skel-card-head"><div class="skeleton"></div></div>
          <div class="skel-card-row"><div class="skeleton skel-card-icon"></div>
            <div class="skel-card-text"><div class="skeleton"></div><div class="skeleton"></div></div>
            <div class="skeleton skel-card-button"></div></div>
          <div class="skel-card-row"><div class="skeleton skel-card-icon"></div>
            <div class="skel-card-text"><div class="skeleton"></div><div class="skeleton"></div></div>
            <div class="skeleton skel-card-button"></div></div>
          <div class="skel-card-row"><div class="skeleton skel-card-icon"></div>
            <div class="skel-card-text"><div class="skeleton"></div><div class="skeleton"></div></div>
            <div class="skeleton skel-card-button"></div></div>
        </div>
        <div class="skel-outline skel-card">
          <div class="skel-card-head"><div class="skeleton"></div></div>
          <div class="skel-card-row"><div class="skeleton skel-card-icon"></div>
            <div class="skel-card-text"><div class="skeleton"></div><div class="skeleton"></div></div>
            <div class="skeleton skel-card-button"></div></div>
          <div class="skel-card-row"><div class="skeleton skel-card-icon"></div>
            <div class="skel-card-text"><div class="skeleton"></div><div class="skeleton"></div></div>
            <div class="skeleton skel-card-button"></div></div>
        </div>
      </div>
    </div>
  </div>

  <div id="boot-skeleton" class="skeleton-screen skeleton-signed-out" aria-hidden="true">
    <div class="skel-signin">
      <div class="skel-signin-wrap">
        <div class="skeleton skel-signin-back"></div>
        <div class="skel-signin-card">
          <div class="skeleton skel-signin-kicker"></div>
          <div class="skeleton skel-signin-title"></div>
          <div class="skel-signin-button"></div>
          <div class="skel-signin-note"><div class="skeleton"></div></div>
        </div>
      </div>
    </div>
    <div class="skel-footer"><div class="skeleton"></div><div class="skeleton"></div></div>
  </div>

  <div id="login-screen" class="signin-screen">
    <div class="signin-wrap">
      <a class="signin-back" id="signin-back" href="../"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i>View
        Timetable</a>
      <section class="signin-card" aria-labelledby="login-title">
        <h2>Timetable</h2>
        <h1 id="login-title">Control Panel</h1>
        <button class="btn-google" id="signin-btn" type="button" onclick="signIn()">
          <svg class="google-icon" viewBox="0 0 18 18" aria-hidden="true">
            <path
              d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"
              fill="#4285F4" />
            <path
              d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"
              fill="#34A853" />
            <path
              d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"
              fill="#FBBC05" />
            <path
              d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"
              fill="#EA4335" />
          </svg>
          Sign in
        </button>
        <p class="signin-note"><i class="fa-solid fa-lock" aria-hidden="true"></i>Lecturer access only</p>
      </section>
    </div>
  </div>

  <div id="error-screen">
    <div class="error-card">
      <h2>Access Denied</h2>
      <p id="error-msg">You do not have access here.</p>
      <button class="btn-secondary" onclick="signOut()"><i class="fa-solid fa-right-from-bracket"
          style="margin-right:6px"></i>Sign out</button>
    </div>
  </div>

  <!-- sidebar-desktop-hidden is permanent here: this panel edits one global
       configuration, so there's no course list to put in a sidebar, and the
       class keeps .main-area from reserving room for one. -->
  <div id="admin-app" class="sidebar-desktop-hidden">
    <div class="top-bar">
      <span class="top-bar-title"><i class="fa-solid fa-calendar-days"
          style="margin-right:8px;opacity:0.85;font-size:0.9em"></i><span class="top-bar-title-text">Timetable
          Panel</span></span>
      <span class="top-bar-user" id="top-user"></span>
      <button class="btn-ghost btn-sm" id="signout-btn" onclick="signOut()"><i class="fa-solid fa-right-from-bracket"
          style="margin-right:5px"></i><span class="signout-text">Sign out</span></button>
    </div>
    <main class="main-area" id="main-area">
      <div class="section-tabs" id="section-tabs"></div>
      <div class="section-body" id="section-body"></div>
    </main>
  </div>

  <footer class="footer">
    <div class="social-links">
      <a id="footer-back" href="../" rel="noopener noreferrer"><i class="fa-solid fa-arrow-left" title="Back"></i></a>
      <a id="footer-home" href="/" rel="noopener noreferrer"><i class="fa-solid fa-house" title="Home"></i></a>
      <button id="theme-toggle" class="theme-toggle" aria-label="Theme: Auto" title="Theme: Auto">
        <i id="theme-toggle-icon" class="fa-solid fa-adjust" aria-hidden="true"></i>
      </button>
    </div>
    <p style="font-size:0.8em; text-transform: uppercase; letter-spacing: 2px; font-weight: 700;">
      <i class="fa-regular fa-copyright"></i> <span id="footer-start-year">2023</span>–<span id="currentYear"></span>
      <span id="footer-owner"></span>. All Rights Reserved.
    </p>
  </footer>

  <!-- onmousedown guard: without it, a drag that starts inside the modal and
       releases on the backdrop would read as a backdrop click and discard the
       edit. Both ends of the click must be on the overlay itself. -->
  <div class="modal-overlay" id="modal-overlay" onmousedown="_overlayMD=event.target===this"
    onclick="if(_overlayMD&&event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modal-title">Edit</h3>
        <button class="btn-ghost btn-icon" onclick="closeModal()" style="margin-left:auto;padding:5px 9px;"><i
            class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot" id="modal-foot">
        <button class="btn-secondary btn-sm" onclick="closeModal()"><i class="fa-solid fa-xmark"
            style="margin-right:5px"></i>Close</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="confirm-overlay" onmousedown="_confirmOverlayMD=event.target===this"
    onclick="if(_confirmOverlayMD&&event.target===this)_resolveConfirm(false)">
    <div class="modal confirm-modal">
      <div class="modal-head">
        <h3 id="confirm-title">Please Confirm</h3>
      </div>
      <div class="modal-body" id="confirm-body"></div>
      <div class="modal-foot">
        <button class="btn-secondary btn-sm" onclick="_resolveConfirm(false)"><i class="fa-solid fa-xmark"
            style="margin-right:5px"></i>Cancel</button>
        <button class="btn-sm" id="confirm-ok-btn" onclick="_resolveConfirm(true)"><i class="fa-solid fa-check"
            style="margin-right:5px"></i>Confirm</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- Google Identity Services — One Tap sign-in (ID token → Supabase). The onload
       hook re-triggers One Tap if the login screen appeared before this loaded. -->
  <script src="https://accounts.google.com/gsi/client" async defer
    onload="window._gsiOnLoad && window._gsiOnLoad()"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.4/Sortable.min.js"></script>
  <!-- Sanitizes the EIS fragment shown by the "Test" button on entry cards. -->
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <!-- Same config file as the course pages and /timetable/: one place per deployment.
       timetable.js renders the "Test" preview exactly as the public page does. -->
  <script src="../../js/config.js"></script>
  <!-- Shared helpers, here for the lecturer order used when sorting entries. -->
  <script src="../../js/sites.js"></script>
  <script src="../../js/timetable.js"></script>
  <script src="../../js/icons.js"></script>
  <script src="../js/common.js"></script>
  <script src="../../js/session-guard.js"></script>
  <script src="js/scripts.js"></script>
</body>

</html>
