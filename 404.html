<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f4f4">
  <meta name="robots" content="noindex">
  <title>Page not found</title>
  <!-- GitHub Pages serves this file at any missing address, so every path is absolute. -->
  <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/favicon/favicon.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      let theme = 'auto';
      try { theme = localStorage.getItem('theme-preference') || 'auto'; } catch { }
      if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
      const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.querySelector('meta[name="theme-color"]').content = dark ? '#000000' : '#f4f4f4';
    })();

    // A lecturer's page typed with capitals or a course after it (/BPlaku, /bplaku/CE_121):
    // go to the lecturer's folder, with the course as its #hash, when that folder exists.
    (async function () {
      const parts = location.pathname.split('/').filter(Boolean).map(part => decodeURIComponent(part));
      if (!parts.length) return;
      const folder = parts[0].toLowerCase();
      const course = parts.slice(1).join('_');
      if (folder === parts[0] && !course) return;
      const target = new URL('/' + encodeURIComponent(folder) + '/', location.origin);
      try {
        const response = await fetch(target, { method: 'HEAD', cache: 'no-cache' });
        if (!response.ok || !response.url.startsWith(target.href)) return;
        location.replace(target.href + location.search + (course ? '#' + encodeURIComponent(course) : location.hash));
      } catch { }
    })();
  </script>
  <style>
    :root {
      --background: #f4f4f4;
      --surface: #fff;
      --text: #333;
      --muted: #707070;
      --border: rgba(0, 0, 0, 0.1);
      --accent: #3949ab;
      --accent-dark: #1a237e;
      --accent-text: #3949ab;
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --background: #000;
        --surface: #121212;
        --text: #e0e0e0;
        --muted: #9e9e9e;
        --border: #333;
        --accent-text: #9fa8da;
        color-scheme: dark;
      }
    }

    :root[data-theme="dark"] {
      --background: #000;
      --surface: #121212;
      --text: #e0e0e0;
      --muted: #9e9e9e;
      --border: #333;
      --accent-text: #9fa8da;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--background);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 32px 16px;
      background: var(--background);
      color: var(--text);
      font: 16px/1.5 'Google Sans Flex', system-ui, sans-serif;
      text-align: center;
    }

    .brand {
      margin-bottom: 36px;
      color: inherit;
      font-size: 1.1em;
      font-weight: 700;
      text-decoration: none;
    }

    .code {
      margin: 0;
      color: var(--accent-text);
      font-size: 0.85em;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    h1 {
      margin: 4px 0 8px;
      font-size: 1.9em;
      line-height: 1.2;
    }

    p {
      max-width: 26rem;
      margin: 0 0 28px;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .actions a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 22px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--surface);
      color: inherit;
      font-size: 0.92em;
      font-weight: 600;
      text-decoration: none;
    }

    .actions a:hover {
      border-color: var(--muted);
    }

    .actions a.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .actions a.primary:hover {
      background: var(--accent-dark);
    }

    a:focus-visible {
      outline: 2px solid var(--accent-text);
      outline-offset: 3px;
    }
  </style>
</head>

<body>
  <a class="brand" href="/">Syllabase</a>
  <main>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>This address doesn’t lead to a page. Check it for typos, or find the course from the list of all
      courses.</p>
    <div class="actions">
      <a class="primary" href="/">Browse courses</a>
      <a href="/timetable/">Class timetable</a>
    </div>
  </main>
</body>

</html>
